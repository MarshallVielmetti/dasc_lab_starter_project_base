[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "dasc-lab-starter-project"
version = "0.1.0"
description = "DASC lab exercises"
requires-python = ">=3.11,<3.15"
dependencies = []

[dependency-groups]
test = [
    "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dasc_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
